name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: 'PHP Tests (FreeBSD)'
    runs-on: FreeBSD

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP dependencies
        run: |
          # Detect PHP version prefix (e.g. "php83")
          PHP_PKG=$(pkg query -x '%n' '^php[0-9]+-[0-9]' 2>/dev/null | head -1 | sed 's/-[0-9].*//')
          if [ -z "$PHP_PKG" ]; then
            PHP_PKG="php83"
          fi
          echo "PHP package prefix: ${PHP_PKG}"

          NEEDED=""
          for ext in curl dom mbstring tokenizer xml xmlwriter; do
            if ! pkg info -e "${PHP_PKG}-${ext}" 2>/dev/null; then
              NEEDED="${NEEDED} ${PHP_PKG}-${ext}"
            fi
          done

          # Vendored curl suite requires curl and tokenizer explicitly
          for pkg in php84-curl php84-tokenizer; do
            if ! pkg info -e "$pkg" 2>/dev/null; then
              NEEDED="${NEEDED} ${pkg}"
            fi
          done

          # PHPUnit from system packages (package name includes PHP version suffix)
          PHPUNIT_PKG="phpunit11-${PHP_PKG}"
          if ! pkg info -e "${PHPUNIT_PKG}" 2>/dev/null; then
            NEEDED="${NEEDED} ${PHPUNIT_PKG}"
          fi

          if [ -n "$NEEDED" ]; then
            echo "Installing:${NEEDED}"
            doas pkg install -y ${NEEDED}
            for ini in /usr/local/etc/php/ext-*.ini.sample; do
              target="${ini%.sample}"
              [ ! -f "$target" ] && doas cp "$ini" "$target"
            done
          else
            echo "All dependencies already installed"
          fi

          php -v
          phpunit --version

      - name: PHP syntax check
        run: find classes tools bin system libraries -name "*.php" | xargs -n1 php -l

      - name: Run tests
        run: phpunit --colors=always

      - name: curl behaviour suite and lint (vendored libraries)
        run: |
          php tests/enchilada-curl/run.php --lib=libraries
          php tests/enchilada-curl/lint_curl_door.php libraries/EnchiladaCurl libraries/EnchiladaMultiHTTP libraries/EnchiladaWorkerHTTP libraries/Enchilada/Tortilla

  behaviour-windows:
    name: 'curl behaviour suite (Windows)'
    runs-on: windows-2022

    env:
      PHP_DIR: C:\php84

    steps:
      - name: Checkout
        shell: powershell
        run: |
          cd "$env:GITHUB_WORKSPACE"
          Get-ChildItem | Remove-Item -Recurse -Force
          $ref = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:GITHUB_HEAD_REF } else { $env:GITHUB_SHA }
          & curl.exe -fL --ssl-no-revoke --retry 6 --retry-delay 5 -o repo.tar.gz "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/archive/$ref.tar.gz"
          if ($LASTEXITCODE -ne 0) { throw "repo tarball fetch failed (curl rc=$LASTEXITCODE)" }
          tar xf repo.tar.gz --strip-components=1
          Remove-Item repo.tar.gz

      - name: PHP (preinstalled on runner02)
        shell: powershell
        run: |
          if (-not (Test-Path "$env:PHP_DIR\php.exe")) { throw "PHP not installed at $env:PHP_DIR" }
          Add-Content -Path $env:GITHUB_PATH -Value $env:PHP_DIR

      - name: curl behaviour suite and lint (vendored libraries)
        shell: powershell
        run: |
          cd "$env:GITHUB_WORKSPACE"
          php -v
          php tests/enchilada-curl/run.php --lib=libraries
          if ($LASTEXITCODE -ne 0) { throw "behaviour suite failed" }
          php tests/enchilada-curl/lint_curl_door.php libraries/EnchiladaCurl libraries/EnchiladaMultiHTTP libraries/EnchiladaWorkerHTTP libraries/Enchilada/Tortilla
          if ($LASTEXITCODE -ne 0) { throw "curl lint failed" }
